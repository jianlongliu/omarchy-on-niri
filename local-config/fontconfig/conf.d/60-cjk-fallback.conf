<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  用户级补充规则（放在 conf.d/，不放进 fonts.conf）。

  为什么单独一个文件：`omarchy-font-set`（omarchy menu → style → font 背后的命令）
  用 `cat > "$HOME/.config/fontconfig/fonts.conf"` **整个覆盖** fonts.conf，
  只写它那一条 monospace 规则。写在那里的中文回退会被一次性冲掉，
  放 conf.d/ 就与菜单解耦，随便怎么换字体都不丢。

  内容：
    1) 中文回退固定为苹方（PingFang SC），杜绝 MS Gothic（日文）混入；
       sans-serif / SF Pro / Adwaita Sans 三条链保持与原先一致。
    2) monospace 只补回退：中文 → Noto Sans Mono CJK SC；
       Nerd Font 图标 → SFMono Nerd Font（Google Sans Code 没有图标字形）。
       首选等宽族仍由 fonts.conf 里的 prepend_first 决定（现为 Google Sans Code）。
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>SF Pro</string>
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Adwaita Sans</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Adwaita Sans</string>
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>SF Pro</string>
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>PingFang SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>SFMono Nerd Font</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
</fontconfig>
